<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    
    <style>
        /* [CSS] 화면 전체 레이아웃 설정 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        /* [CSS] 좌우 2분할 컨테이너 */
        .container {
            display: flex;
            height: 100vh;
        }

        /* [CSS] 왼쪽 검색창 + 결과창 패널 */
        .left-panel {
            width: 350px;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #ddd;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
        }

        /* [CSS] 오른쪽 지도 패널 */
        .right-panel {
            flex-grow: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* [CSS] 검색창 UI */
        .search-container {
            display: flex;
            margin-bottom: 20px;
        }

        #searchInput {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
            font-size: 14px;
        }

        #searchBtn {
            padding: 10px 15px;
            background-color: #ffe812; /* 카카오 노란색 */
            border: 1px solid #ccc;
            border-left: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-weight: bold;
        }

        /* [CSS] 검색 결과 리스트 스타일 */
        #resultList {
            list-style-type: none;
            padding: 0;
            margin: 0;
            overflow-y: auto; /* 결과가 많으면 스크롤 생성 */
            flex-grow: 1;
        }

        .result-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .result-item:hover {
            background-color: #f0f0f0;
        }

        .result-item strong {
            display: block;
            color: #333;
            font-size: 15px;
        }

        .result-item p {
            margin: 5px 0 0 0;
            color: #666;
            font-size: 13px;
        }
    </style>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9eeaf0841c08a384eabb2f16d0262db8&libraries=services&autoload=false"></script>
</head>
<body>

    <div class="container">
        <div class="left-panel">
            <h2>장소 검색</h2>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="ex) 이태원 맛집, 스타벅스">
                <button id="searchBtn">검색</button>
            </div>
            <ul id="resultList"></ul>
        </div>

        <div class="right-panel">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // 지도가 안전하게 로드된 후 실행
        kakao.maps.load(function() {
            const mapContainer = document.getElementById('map'); 
            let map;
            let markers = []; // 검색된 장소 마커들을 관리하는 배열
            let currentMarker = null; // 현재 위치 마커를 따로 저장할 변수
            
            // 카카오 장소 검색 서비스 객체 생성
            const placeService = new kakao.maps.services.Places(); 

            // [1] 현재 위치 기반 지도 초기화
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const currentPos = new kakao.maps.LatLng(position.coords.latitude, position.coords.longitude);
                        initMap(currentPos, true); // 현재 위치를 성공적으로 찾았을 때
                    }, 
                    function() {
                        // 위치 권한 거부 시 기본값 (서울시청)
                        initMap(new kakao.maps.LatLng(37.566826, 126.9786567), false);
                    }
                );
            } else {
                initMap(new kakao.maps.LatLng(37.566826, 126.9786567), false);
            }

            // 지도를 띄우고 이벤트를 연결하는 함수
            function initMap(centerPosition, isCurrentLocationValid) {
                const mapOptions = {
                    center: centerPosition,
                    level: 5 // 요청한 확대 레벨 5
                };
                map = new kakao.maps.Map(mapContainer, mapOptions);

                // 현재 위치 권한을 제대로 허용받았을 때만 "내 위치" 마커와 말풍선 표시
                if (isCurrentLocationValid) {
                    currentMarker = new kakao.maps.Marker({ 
                        position: centerPosition, 
                        map: map 
                    });

                    // 내 위치를 한눈에 알아볼 수 있게 만드는 말풍선(InfoWindow) 생성
                    const centerInfoWindow = new kakao.maps.InfoWindow({
                        content: '<div style="padding:5px; font-size:12px; text-align:center; font-weight:bold; color:#e74c3c; width:60px;">📍 내 위치</div>'
                    });
                    
                    // 말풍선을 현재 위치 마커 위에 띄우기
                    centerInfoWindow.open(map, currentMarker);
                }

                // 검색 버튼 클릭 이벤트 연결
                document.getElementById('searchBtn').addEventListener('click', startSearch);
                
                // 검색창에서 엔터키 눌렀을 때도 검색되게 설정
                document.getElementById('searchInput').addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        startSearch();
                    }
                });
            }

            // [2] 검색 시작 함수
            function startSearch() {
                const keyword = document.getElementById('searchInput').value.trim();
                
                if (!keyword) {
                    alert('검색어를 입력해 주세요!');
                    return;
                }

                // 카카오 API로 키워드 검색 요청
                placeService.keywordSearch(keyword, searchCallback);
            }

            // [3] 검색 완료 후 호출되는 콜백 함수
            function searchCallback(data, status, pagination) {
                if (status === kakao.maps.services.Status.OK) {
                    displaySearchResults(data);
                } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                    alert('검색 결과가 없습니다.');
                } else if (status === kakao.maps.services.Status.ERROR) {
                    alert('검색 중 오류가 발생했습니다.');
                }
            }

            // [4] 검색 결과를 화면과 지도에 표시하는 함수
            function displaySearchResults(places) {
                const listContainer = document.getElementById('resultList');
                
                clearMapAndList(); // 기존에 찍혀있던 "검색 결과 마커"와 리스트만 초기화 (내 위치 마커는 유지됨)
                
                // 검색된 장소들을 다 포함할 수 있도록 지도 범위를 재설정할 객체
                const mapBounds = new kakao.maps.LatLngBounds();

                places.forEach(function(place) {
                    const placePos = new kakao.maps.LatLng(place.y, place.x);
                    
                    // 지도에 검색 결과 마커 생성
                    const marker = new kakao.maps.Marker({
                        position: placePos,
                        map: map
                    });
                    markers.push(marker); // 검색 마커 배열에 저장
                    mapBounds.extend(placePos); // 검색된 장소 위치를 범위에 포함

                    // 왼쪽 패널에 추가할 리스트 아이템 HTML 만들기
                    const li = document.createElement('li');
                    li.className = 'result-item';
                    li.innerHTML = `<strong>${place.place_name}</strong><p>${place.address_name}</p>`;
                    
                    // 리스트 아이템을 클릭하면 해당 장소로 지도 중심을 이동시킴
                    li.addEventListener('click', function() {
                        map.setCenter(placePos);
                        map.setLevel(3); // 클릭 시 조금 더 자세히 보이게 확대
                    });

                    listContainer.appendChild(li);
                });

                // 검색된 장소들이 모두 한눈에 보이게 지도 중심/레벨 자동 조절
                map.setBounds(mapBounds);
            }

            // 기존 "검색 결과 마커"와 결과 리스트만 지워주는 청소 함수
            function clearMapAndList() {
                markers.forEach(function(marker) {
                    marker.setMap(null);
                });
                markers = []; // 검색 결과 마커 배열만 초기화 (currentMarker는 건드리지 않음!)
                document.getElementById('resultList').innerHTML = '';
            }
        });
    </script>
</body>
</html>
