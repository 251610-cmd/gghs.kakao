<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    
    <style>
        /* [CSS] 화면 전체 레이아웃 설정 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        /* [CSS] 좌우 2분할 컨테이너 */
        .container {
            display: flex;
            height: 100vh;
        }

        /* [CSS] 왼쪽 검색창 + 결과창 패널 */
        .left-panel {
            width: 350px;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #ddd;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
        }

        /* [CSS] 오른쪽 지도 패널 */
        .right-panel {
            flex-grow: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* [CSS] 검색창 UI */
        .search-container {
            display: flex;
            margin-bottom: 10px; /* 탭 버튼과의 간격을 위해 조정 */
        }

        #searchInput {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
            font-size: 14px;
        }

        #searchBtn {
            padding: 10px 15px;
            background-color: #ffe812; /* 카카오 노란색 */
            border: 1px solid #ccc;
            border-left: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-weight: bold;
        }

        /* [CSS] 행정 카테고리 3개 탭 스타일 */
        .category-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 20px;
        }

        .category-btn {
            padding: 8px 2px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #ccc;
            background-color: white;
            color: #333;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .category-btn:hover {
            background-color: #ffe812; /* 마우스 올리면 카카오 노란색으로 하이라이트 */
            border-color: #ffe812;
        }

        /* [CSS] 검색 결과 리스트 스타일 */
        #resultList {
            list-style-type: none;
            padding: 0;
            margin: 0;
            overflow-y: auto; /* 결과가 많으면 스크롤 생성 */
            flex-grow: 1;
        }

        .result-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .result-item:hover {
            background-color: #f0f0f0;
        }

        .result-item strong {
            display: block;
            color: #333;
            font-size: 15px;
        }

        .result-item p {
            margin: 5px 0 0 0;
            color: #666;
            font-size: 13px;
        }
    </style>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9eeaf0841c08a384eabb2f16d0262db8&libraries=services&autoload=false"></script>
</head>
<body>

    <div class="container">
        <div class="left-panel">
            <h2>장소 검색</h2>
            
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="ex) 이태원 맛집, 스타벅스">
                <button id="searchBtn">검색</button>
            </div>

            <div class="category-container">
                <button class="category-btn" onclick="clickCategory('행정복지센터')">🏢 주민센터</button>
                <button class="category-btn" onclick="clickCategory('보건소')">🏥 보건소</button>
                <button class="category-btn" onclick="clickCategory('구청')">🏛️ 구청/시청</button>
            </div>

            <ul id="resultList"></ul>
        </div>

        <div class="right-panel">
            <div id="map"></div>
        </div>
    </div>

    <script>
        let map;
        let placeService;
        let markers = []; // 지도에 표시된 검색 마커들을 관리하는 배열
        let currentPos = null; // 현재 위치 좌표를 기억할 변수

        // 지도가 안전하게 로드된 후 실행
        kakao.maps.load(function() {
            const mapContainer = document.getElementById('map'); 
            placeService = new kakao.maps.services.Places(); 

            // [1] 현재 위치 기반 지도 초기화
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        currentPos = new kakao.maps.LatLng(position.coords.latitude, position.coords.longitude);
                        initMap(currentPos, true);
                    }, 
                    function() {
                        // 위치 권한 거부 시 기본값 (서울시청)
                        currentPos = new kakao.maps.LatLng(37.566826, 126.9786567);
                        initMap(currentPos, false);
                    }
                );
            } else {
                currentPos = new kakao.maps.LatLng(37.566826, 126.9786567);
                initMap(currentPos, false);
            }

            // 지도를 띄우고 이벤트를 연결하는 함수
            function initMap(centerPosition, isCurrentLocationValid) {
                const mapOptions = {
                    center: centerPosition,
                    level: 5 // 요청한 확대 레벨 5
                };
                map = new kakao.maps.Map(mapContainer, mapOptions);

                // 현재 위치를 정상적으로 가져왔다면 글자 없이 '⭐' 모양으로 퉁쳐서 표시
                if (isCurrentLocationValid) {
                    new kakao.maps.CustomOverlay({
                        position: centerPosition,
                        content: '<div style="font-size: 28px; style="text-shadow: 1px 1px 2px rgba(0,0,0,0.3); transform: translate(-50%, -50%); pointer-events: none;">⭐</div>',
                        map: map,
                        zIndex: 10 // 별 표시는 검색 마커보다 무조건 위에 보이도록 설정
                    });
                }

                // 검색 버튼 클릭 이벤트 연결
                document.getElementById('searchBtn').addEventListener('click', startSearch);
                
                // 검색창에서 엔터키 눌렀을 때도 검색되게 설정
                document.getElementById('searchInput').addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        startSearch();
                    }
                });
            }
        });

        // [2] 탭 버튼 클릭 시 검색창 텍스트를 바꾸고 바로 검색해주는 함수
        function clickCategory(keyword) {
            document.getElementById('searchInput').value = keyword;
            startSearch();
        }

        // [3] 검색 시작 함수
        function startSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            
            if (!keyword) {
                alert('검색어를 입력해 주세요!');
                return;
            }

            // 내 주변 위치 위주로 결과가 먼저 나오도록 옵션 추가
            const searchOptions = {};
            if (currentPos) {
                searchOptions.location = currentPos;
                searchOptions.radius = 5000; //
